      </stop>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.15"/>
    </linearGradient>
