<svg xmlns="http://www.w3.org/2000/svg" width="320" height="158" viewBox="0 0 320 158" role="img" aria-label="Rainbow-Cats">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DB2777" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="cGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DB2777" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#DB2777" stop-opacity="0"/>
    </radialGradient>
    <filter id="cShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="320" height="158" rx="18" fill="url(#cBg)" stroke="rgba(148,163,184,0.45)" stroke-width="1" filter="url(#cShadow)"/>
  <circle cx="30" cy="22" r="92" fill="url(#cGlow)"/>
  <line x1="4" y1="0.5" x2="316" y2="0.5" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.5"/>

  <!-- 图标 -->
  <rect x="16" y="16" width="42" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.75"
        stroke="#DB2777" stroke-opacity="0.45" stroke-width="1"/>
  <text x="37" y="45" text-anchor="middle" font-size="21">💘</text>

  <!-- 名称 + 箭头 -->
  <text x="70" y="35" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0F172A">Rainbow-Cats</text>
  <text x="70" y="53" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#64748B">@angexqc/Rainbow-Cats</text>
  <text x="300" y="33" text-anchor="middle" font-size="15" fill="#DB2777">↗</text>

      <text x="18" y="96" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#475569">情侣点餐微信小程序：情侣专属任务系统 + 积分</text>
